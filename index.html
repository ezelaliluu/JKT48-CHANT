<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKT48 Official Chant & Setlist Player</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #e60012; }

        /* ANIMASI CROSS-FADE POP 1:1 (PERSIS VIDEO UTAMA WEB JKT48) */
        @keyframes crossFadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes crossFadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.04); }
        }
        .card-fade-in { animation: crossFadeIn 0.3s ease-out forwards; }
        .card-fade-out { animation: crossFadeOut 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-[#333333] min-h-screen flex flex-col antialiased overflow-hidden select-none">

    <header class="border-b border-gray-200 bg-white px-8 py-3.5 flex justify-between items-center z-45 shadow-sm">
        <div class="flex items-center gap-4">
            <span class="text-2xl font-extrabold tracking-tight text-[#e60012]">JKT48 <span class="text-gray-800 font-light text-xl">| CHANT</span></span>
            <div class="h-5 w-[1px] bg-gray-300"></div>
            <p class="text-xs font-semibold text-gray-500 tracking-wide uppercase" id="setlist-title">Loading Setlist...</p>
        </div>
        <div class="flex items-center gap-4 text-xs font-medium text-gray-700">
            <div class="flex items-center gap-2 bg-gray-100 border px-4 py-1.5 rounded-full shadow-sm">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                Halo, <span class="font-bold">Muhammad Alfarezel Arsano</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 h-[calc(100vh-70px)] items-stretch">
        
        <div class="lg:col-span-3 bg-white border border-gray-200 rounded-lg p-4 flex flex-col h-[calc(100vh-110px)] overflow-y-auto shadow-sm">
            <div class="mb-4">
                <label class="text-xs font-extrabold text-gray-400 block mb-1.5 uppercase tracking-wide">Pilih Album Teater</label>
                <select id="setlist-selector" class="w-full bg-gray-50 border border-gray-200 rounded px-3 py-2 text-xs font-bold text-gray-700 outline-none focus:border-[#e60012] transition cursor-pointer">
                    </select>
            </div>
            
            <div class="h-[1px] bg-gray-100 my-2"></div>

            <h3 class="text-xs font-extrabold text-gray-400 tracking-wide uppercase mb-3 mt-1 px-1">Daftar Track</h3>
            <div class="space-y-1 flex-1" id="tracklist-container"></div>
        </div>

        <div class="lg:col-span-4 bg-white border border-gray-200 rounded-lg p-6 flex flex-col justify-between items-center h-[calc(100vh-110px)] relative overflow-hidden shadow-sm">
            <div class="absolute top-4 left-6 right-6 flex justify-between items-center text-xs font-bold text-gray-400 tracking-wider">
                <span>STAGE DISPLAY</span>
                <span id="track-counter" class="text-[#e60012] bg-red-50 px-2 py-0.5 rounded border border-red-100">0/0</span>
            </div>

            <div class="relative w-full max-w-[300px] aspect-square flex items-center justify-center mt-4" id="crossfade-container"></div>

            <div class="w-full space-y-4 mt-6 px-10">
                <div class="flex items-center gap-3 text-[11px] font-mono font-bold text-gray-400">
                    <span id="time-current">0:00</span>
                    <div id="progress-container" class="flex-1 h-1 bg-gray-200 rounded-full cursor-pointer relative group transition-all hover:h-1.5">
                        <div id="progress-bar" class="h-full bg-[#e60012] rounded-full w-0 transition-all duration-100 ease-linear"></div>
                    </div>
                    <span id="time-duration">0:00</span>
                </div>

                <div class="flex justify-center gap-3">
                    <button id="btn-prev" class="w-10 h-10 bg-gray-50 border border-gray-200 rounded-full flex items-center justify-center text-xs text-gray-500 hover:text-white hover:bg-[#e60012] shadow-sm active:scale-95 transition">▲</button>
                    <button id="btn-play-toggle" class="w-12 h-12 bg-[#e60012] rounded-full flex items-center justify-center text-base text-white hover:bg-red-700 shadow-md active:scale-95 transition">▶</button>
                    <button id="btn-next" class="w-10 h-10 bg-gray-50 border border-gray-200 rounded-full flex items-center justify-center text-xs text-gray-500 hover:text-white hover:bg-[#e60012] shadow-sm active:scale-95 transition">▼</button>
                </div>
                <audio id="audio-player" class="hidden"></audio>
            </div>
        </div>

        <div class="lg:col-span-5 bg-white border border-gray-200 rounded-lg p-6 md:p-8 flex flex-col h-[calc(100vh-110px)] overflow-y-auto shadow-sm">
            <div class="sticky top-0 bg-white pt-1 pb-4 z-10 flex justify-between items-center border-b border-gray-100">
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-gray-400 uppercase">SETLIST TRACK</span>
                    <h2 id="current-track-tag" class="text-2xl font-extrabold text-[#e60012] mt-0.5 tracking-tight">LOADING...</h2>
                </div>
                <span class="text-[11px] font-bold px-2.5 py-1 bg-gray-900 text-white rounded shadow-sm tracking-tight">LIVE CHANT</span>
            </div>
            <div id="lyrics-container" class="space-y-10 text-2xl font-bold tracking-tight pt-8 pb-32 text-gray-800 transition-all duration-500"></div>
        </div>

    </main>

    <script src="songs/pertanda.js"></script>
    <script src="songs/schoolyards-puppy.js"></script>
    <script src="songs/disco-di-uks.js"></script>
    <script src="songs/cara-meminum-ramune.js"></script>

    <script src="songs/two-years-later.js"></script>

    <script src="playlist.js"></script>
    <script src="app.js"></script>
</body>
</html>
